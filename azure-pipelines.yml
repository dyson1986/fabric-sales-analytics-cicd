
    - script: |
        echo "===== PIPELINE CHECKOUT DETAILS ====="
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"
        echo "Repository: $(Build.SourcesDirectory)"

        echo "===== ROOT FILES ====="
        ls -la "$(Build.SourcesDirectory)"

        echo "===== PYTHON SCRIPT CONTENT ====="
        cat "$(Build.SourcesDirectory)/scripts/validate_repo.py"

        echo "===== CHECK REQUIREMENTS ====="
        test -f "$(Build.SourcesDirectory)/requirements.txt" || {
          echo "ERROR: Root requirements.txt is missing"
          exit 1
        }

        echo "===== INSTALL DEPENDENCIES ====="
        python -m pip install --upgrade pip
        python -m pip install -r "$(Build.SourcesDirectory)/requirements.txt"

        echo "===== RUN REPOSITORY VALIDATION ====="
        python "$(Build.SourcesDirectory)/scripts/validate_repo.py"
      displayName: 'Diagnose and validate Fabric repository'
