trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: fabric-cicd-secrets
  - group: fabric-cicd-config

stages:

# STAGE 1: Validate repository
- stage: Validate
  displayName: 'Validate Fabric Repository'
  jobs:
  - job: ValidateRepo
    displayName: 'Check Fabric Items'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python scripts/validate_repo.py
      displayName: 'Install dependencies and validate repository'

# STAGE 2: Deploy to TEST
- stage: Deploy_Test
  displayName: 'Deploy to TEST'
  dependsOn: Validate
  condition: succeeded()
  jobs:
  - job: DeployTest
    displayName: 'Publish Fabric Items to TEST'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'

    - script: |
        pip install -r requirements.txt
        python deploy/deploy_fabric.py
      displayName: 'Deploy Fabric items'
      env:
        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
        AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
        FABRIC_WORKSPACE_ID: $(FABRIC_TEST_WORKSPACE_ID)
        FABRIC_ENVIRONMENT: TEST

# STAGE 3: Deploy to PROD
- stage: Deploy_Prod
  displayName: 'Deploy to PROD'
  dependsOn: Deploy_Test
  condition: succeeded()
  jobs:
  - job: DeployProd
    displayName: 'Publish Fabric Items to PROD'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'

    - script: |
        pip install -r requirements.txt
        python deploy/deploy_fabric.py
      displayName: 'Deploy Fabric items'
      env:
        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
        AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
        FABRIC_WORKSPACE_ID: $(FABRIC_PROD_WORKSPACE_ID)
        FABRIC_ENVIRONMENT: PROD
