
- stage: Deploy_Prod
  displayName: 'Deploy Fabric Items to PROD'
  dependsOn: Deploy_Test
  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
  - deployment: DeployProd
    displayName: 'Deploy to PROD Workspace'
    environment: 'fabric-sales-analytics-prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
          - script: |
              python -m pip install --upgrade pip
              python -m pip install -r "$(Build.SourcesDirectory)/requirements.txt"
              python -u "$(Build.SourcesDirectory)/scripts/deploy/deploy_fabric.py"
            displayName: 'Publish Fabric items to PROD'
            env:
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              FABRIC_WORKSPACE_ID: $(FABRIC_PROD_WORKSPACE_ID)
              FABRIC_ENVIRONMENT: PROD
